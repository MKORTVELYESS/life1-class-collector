name: Update classes.csv

# 23:05 UTC ≈ 00:05 Europe/Budapest in winter / 01:05 in summer.
on:
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Collect timetables into classes.csv
        run: ./gradlew run --no-daemon --args="--out=classes.csv"

      - name: Commit and push if classes.csv changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes.csv
          if git diff --staged --quiet; then
            echo "No CSV changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update classes.csv from Life1 / partner timetables"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows' on:push
      # handlers (GitHub recursion guard). Explicitly redeploy Pages instead.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
