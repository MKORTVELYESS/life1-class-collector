name: Update classes.csv

# No cron: local machine dispatches this on boot via scripts/trigger-classes.ps1
# (GitHub-hosted runners get HTTP 403 from Life1 / Lite; home IP works.)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Collect timetables into classes.csv
        shell: powershell
        run: .\gradlew.bat run --no-daemon --args="--out=classes.csv"

      - name: Commit and push if classes.csv changed
        id: commit
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classes.csv
          $changed = git diff --staged --name-only
          if (-not $changed) {
            Write-Host "No CSV changes."
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          git commit -m "Update classes.csv from Life1 / partner timetables"
          git push
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Pushes made with GITHUB_TOKEN do not trigger other workflows' on:push
      # handlers (GitHub recursion guard). Explicitly redeploy Pages instead.
      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches"
          $headers = @{
            Accept                 = "application/vnd.github+json"
            Authorization          = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent"           = "life1-class-list-actions"
          }
          $body = @{ ref = $env:GITHUB_REF_NAME } | ConvertTo-Json
          Write-Host "POST $uri (ref=$($env:GITHUB_REF_NAME))"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType "application/json"
